# Version Catalog: uma fonte única de versões p/ todos os módulos.
# Evita "dependency hell" quando várias marcas/módulos compartilham libs.
[versions]
agp = "8.5.0"
kotlin = "2.0.0"
coroutines = "1.8.1"
composeBom = "2024.06.00"
lifecycle = "2.8.3"
hilt = "2.51.1"
# Car App Library: templates dirigíveis (nav/POI/IoT). Roda em AAOS e Android Auto.
carApp = "1.4.0"
# 'car' (android.car) é da PLATAFORMA (compileOnly): existe no head unit, não no APK.

[libraries]
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
androidx-car-app-automotive = { module = "androidx.car.app:app-automotive", version.ref = "carApp" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
